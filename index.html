<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Tracker</title>
</head>

<body>
    <div class="modal fade" id="editExpenseModal" tabindex="-1" aria-labelledby="editExpenseModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 text-primary" id="editExpenseModalLabel">Edit Expense</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editExpenseForm">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="editExpenseId">
                        <div class="mb-3">
                            <label for="editExpenseName" class="form-label">Name : </label>
                            <input type="text" class="form-control" name="name" id="editExpenseName"
                                placeholder="Enter a name like Groceries...">
                        </div>
                        <div class="mb-3">
                            <label for="editExpenseCategory" class="form-label">Category</label>
                            <select class="form-select" name="category" id="editExpenseCategory" required>
                                <option disabled value="">Select the category...</option>
                                <option value="Food">Food</option>
                                <option value="Housing">Housing</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Education">Education</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editExpenseAmount" class="form-label">Amount : </label>
                            <input type="number" class="form-control" name="Amount" id="editExpenseAmount"
                                placeholder="Amount" min="0.1" step="0.1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Update Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <div class="modal fade" id="editIncomeModal" tabindex="-1" aria-labelledby="editIncomeModalLabel"
        aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 text-primary" id="editIncomeModalLabel">Edit Income</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="editIncomeForm">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="editIncomeId">
                        <div class="mb-3">
                            <label for="editIncomeSource" class="form-label">Source: </label>
                            <select class="form-select" name="source" id="editIncomeSource" required>
                                <option disabled value="">Select the source...</option>
                                <option value="Salary">Salary</option>
                                <option value="Freelance">Freelance</option>
                                <option value="Investment">Investment</option>
                                <option value="Gift">Gift</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editIncomeAmount" class="form-label">Amount : </label>
                            <input type="number" class="form-control" name="Amount" id="editIncomeAmount"
                                placeholder="Amount" min="0.1" step="0.1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Update Income</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <!-- Income Modal -->
    <div class="modal fade" id="addIncome" tabindex="-1" aria-labelledby="addIncomeLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 text-primary" id="addIncomeLabel">add Income</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="incomeform">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="source" class="form-label">source: </label>
                            <select class="form-select" name="source" required>
                                <option disabled selected value="">
                                    select the source...
                                </option>
                                <option value="Salary">Salary</option>
                                <option value="Freelance">Freelance</option>
                                <option value="Investment">Investment</option>
                                <option value="Gift">Gift</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="Amount" class="form-label">Amount : </label>
                            <input type="number" class="form-control" name="Amount" placeholder="Amount" min="0.1"
                                step="0.1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save Income</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <nav class="navbar navbar-expand-md navbar-light bg-light sticky-top">

        <div class="container">
            <a class="navbar-brand" href="#">Expense Tracker</a>
            <button class="navbar-toggler" data-toggle="collapse" data-target="#ourNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div id="ourNavbar" class="collapse navbar-collapse justify-content-evenly">
                <div class="search mx-auto">
                    <input type="text" class="form-control" placeholder="Search transactions..." id="search">
                </div>
                <div class="addButtons">
                    <button type="button" class="navbar-item btn btn-primary add-btn" data-bs-toggle="modal"
                        data-bs-target="#addExpense" id="">Add Expense</button>
                    <button type="button" class="btn btn-primary add-btn" data-bs-toggle="modal"
                        data-bs-target="#addIncome" id="addIncomeButton">Add Income</button>
                </div>
            </div>
        </div>




    </nav>

    <div class=" container text-center" style="height: 100px; width: 900px;">
        <div class="row" style="height: 100px; ">
            <div class="col-sm rounded-2 d-flex align-items-center justify-content-center totalIncome border-0"
                id="totalIncome">

            </div>
            <div class="col-sm rounded-2 totalExpencive d-flex align-items-center justify-content-center border-0"
                id="totalExpencive">

            </div>
            <div class="col-sm rounded-2 Balance d-flex align-items-center justify-content-center border-0"
                id="Balance">

            </div>
        </div>
    </div>




    <div class="main container">
        <div class="table-responsive">
            <table class="table caption-top">
                <caption>
                    List of transactions
                </caption>
                <thead class="table-light">
                    <tr>
                        <th scope="col" width="20%">Type</th>
                        <th scope="col" width="20%">Name</th>
                        <th scope="col" width="20%">Category/Source</th>
                        <th scope="col" width="20%">Amount</th>
                        <th scope="col" width="20%">Action</th>
                    </tr>
                </thead>
                <tbody id="table-body" class="text-left"></tbody>
            </table>
        </div>
    </div>

    <!-- expense Modal -->
    <div class="modal fade" id="addExpense" tabindex="-1" aria-labelledby="addExpenseLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5 text-primary" id="addExpenseLabel">Add Expense</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="expenciveForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name : </label>
                            <input type="text" class="form-control" name="name"
                                placeholder="Enter a name like Groceries...">
                        </div>
                        <div class="mb-3">
                            <label for="category" class="form-label">category</label>
                            <select class="form-select" name="category" required>
                                <option disabled selected value="">
                                    Select the category...
                                </option>
                                <option value="Food">Food</option>
                                <option value="Housing">Housing</option>
                                <option value="Transportation">Transportation</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Education">Education</option>
                                <option value="Shopping">Shopping</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="Amount" class="form-label">Amount : </label>
                            <input type="number" class="form-control" name="Amount" placeholder="Amount" min="0.1"
                                step="0.1">
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Save Expense</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
